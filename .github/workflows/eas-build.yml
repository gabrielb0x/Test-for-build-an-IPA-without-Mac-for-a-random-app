name: EAS Cloud Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-ios-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ env.EXPO_TOKEN }}

      - name: Validate Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "❌ EXPO_TOKEN is missing."
            echo "Add it in: GitHub repository > Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

          echo "✅ EXPO_TOKEN is present"

      - name: Verify Expo authentication
        run: eas whoami

      - name: Trigger iOS production build
        run: eas build --platform ios --profile production --non-interactive --no-wait

      - name: Trigger Android preview build
        run: eas build --platform android --profile preview --non-interactive --no-wait
